<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Créer un compte – TY‑LUDIC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="account-wrapper">

    <h1 data-i18n="create_account_title"></h1>
    <p data-i18n="create_account_text"></p>

    <form id="create-account-form">

        <label for="pseudo" data-i18n="create_account_pseudo"></label>
        <input type="text" id="pseudo" maxlength="16" autocomplete="off" required>

        <small class="hint" data-i18n="create_account_pseudo_control"></small>

        <label for="password" data-i18n="create_account_passwd"></label>
        <input type="password" id="password" minlength="6" required>

        <small class="hint" data-i18n="create_account_passwd_control"></small>

        <div id="error-msg"></div>

        <button type="submit" id="create-btn" data-i18n="create_account_button"></button>

    </form>

</div>

<!-- Firebase global -->
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-analytics.js"></script>

<!-- Ton init global -->
<script src="../../firebase/firebase-init.js"></script>

<!-- SCRIPT CORRIGÉ -->
<script type="module">
import { auth, db } from "../../firebase/firebase-init.js";
import { 
    onAuthStateChanged, 
    createUserWithEmailAndPassword, 
    signOut 
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { doc, setDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const errorBox = document.getElementById("error-msg");
const form = document.getElementById("create-account-form");

// Si déjà connecté → on bloque
onAuthStateChanged(auth, (user) => {
    if (user) {
        errorBox.textContent = "Tu es déjà connecté. Déconnecte-toi pour créer un nouveau compte.";
        form.style.display = "none";

        const btn = document.createElement("button");
        btn.textContent = "Se déconnecter";
        btn.onclick = async () => {
            await signOut(auth);
            window.location.reload();
        };
        errorBox.appendChild(btn);
    }
});

// Création du compte
form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const pseudo = document.getElementById("pseudo").value.trim();
    const password = document.getElementById("password").value;

    if (!pseudo) {
        errorBox.textContent = "Pseudo obligatoire.";
        return;
    }

    try {
        // Création Firebase Auth
        const userCred = await createUserWithEmailAndPassword(
            auth,
            pseudo + "@tyludic.local",
            password
        );

        const user = userCred.user;

        // Enregistrement Firestore minimal
        await setDoc(doc(db, "users", user.uid), {
            pseudo: pseudo,
            createdAt: new Date().toISOString()
        });

        // Stockage pseudo local
        localStorage.setItem("tyludic_pseudo", pseudo);

        // Redirection
        window.location.href = "../index.html";

    } catch (err) {
        errorBox.textContent = "Erreur : " + err.message;
    }
});
</script>

<!-- i18n -->
<script>
    const currentLang = localStorage.getItem("lang") || "fr";

    fetch("lang-create-account.json")
        .then(r => r.json())
        .then(data => {
            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                const text = data[currentLang][key];
                if (text) el.textContent = text;
            });
        })
        .catch(err => console.error("Erreur chargement lang-create-account.json", err));
</script>

</body>
</html>
