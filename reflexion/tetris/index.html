<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TY‑LUDIC — Tetris</title>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="tl-arcade-frame">

        <div id="marquee">TY‑LUDIC — FALLING BLO</div>

        <div id="hud">
            <div id="score">Score : 0</div>
            <div id="level">Niveau : 1</div>
        </div>

        <div id="tl-bezel">
            <div class="canvas-wrapper">
                <canvas id="game" width="500" height="800"></canvas>
            </div>
        </div>
    </div>

    <div id="controls">
        <button id="drop">⬇️</button>
        <button id="rotate">⟳</button>
        <button id="left">◀️</button>
        <button id="right">▶️</button>
    </div>

    <div id="highscores"></div>

    <!-- Moteur du jeu -->
    <script src="canvas.js"></script>
    <script src="grille.js"></script>

    <!-- Firebase MODULAR -->
    <script type="module">
        import { auth, db } from "../../firebase/firebase-init.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
        import { ScoreManager } from "../../js/ScoreManager.js";
        import { startGame } from "./game.js";   // Ton moteur Tetris

        const pseudo = localStorage.getItem("tyludic_pseudo");
        const scoreEl = document.getElementById("score");

        // Vérification de la connexion
        onAuthStateChanged(auth, async (user) => {

            if (!user || !pseudo) {
                alert("ERREUR : utilisateur non connecté");
                window.location.href = "../../index.html";
                return;
            }

            // Chargement du meilleur score
            const best = await ScoreManager.load("tetris");
            console.log("Meilleur score local :", best);

            // Démarrage du jeu
            startGame(async (scoreFinal) => {

                scoreEl.textContent = "Score : " + scoreFinal;

                // Enregistrement Firestore
                const ref = doc(db, "scores_tetris", user.uid);
                await setDoc(ref, {
                    uid: user.uid,
                    pseudo: pseudo,
                    score: scoreFinal,
                    date: new Date().toISOString()
                });

                // Enregistrement local
                await ScoreManager.save("tetris", scoreFinal);

                alert("Score enregistré !");
            });
        });
    </script>

</body>
</html>
