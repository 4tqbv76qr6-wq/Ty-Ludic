<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mon compte TY‑LUDIC</title>

<style>
body {
    background:#0a0a0a;
    color:#eee;
    font-family:system-ui;
    margin:0;
    padding:20px;
}

#panel {
    max-width:500px;
    margin:0 auto;
    background:#111;
    padding:20px;
    border-radius:15px;
    border:3px solid #44f;
    box-shadow:0 0 20px #44f;
}

h1 {
    text-align:center;
    margin-bottom:20px;
}

.section {
    background:#1a1a1a;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    border:2px solid #333;
}

.section h2 {
    margin-top:0;
    color:#44f;
}

#back {
    width:100%;
    padding:15px;
    font-size:18px;
    background:#333;
    border:none;
    border-radius:10px;
    color:white;
    cursor:pointer;
    margin-top:10px;
}
#back:hover {
    background:#444;
}
</style>
</head>

<body>

<div id="panel">
    <h1>Mon compte TY‑LUDIC</h1>

    <div class="section">
        <h2>Informations du compte</h2>
        <p><strong>Pseudo :</strong> <span id="pseudo">...</span></p>
        <p><strong>Date de création :</strong> <span id="created">...</span></p>
        <p><strong>Dernière connexion :</strong> <span id="lastLogin">...</span></p>
    </div>

    <button id="back">Retour au menu</button>
</div>

<!-- Firebase global -->
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-analytics.js"></script>

<!-- Ton init global -->
<script src="../../firebase/firebase-init.js"></script>

<script>
// Récupération des éléments
const pseudoEl = document.getElementById("pseudo");
const createdEl = document.getElementById("created");
const lastLoginEl = document.getElementById("lastLogin");

// Auth globale
window.onAuthStateChanged(window.auth, async (user) => {

    if (!user) {
        window.location.href = "index.html";
        return;
    }

    createdEl.textContent = user.metadata.creationTime;
    lastLoginEl.textContent = user.metadata.lastSignInTime;

    // Lecture Firestore
    const ref = window.doc(window.db, "users/" + user.uid);
    const snap = await window.getDoc(ref);

    if (!snap.exists()) {
        pseudoEl.textContent = "Inconnu";
        return;
    }

    const data = snap.data();

    pseudoEl.textContent = data.pseudo || "Sans pseudo";
});

// Retour
document.getElementById("back").onclick = () => {
    window.location.href = "../../hub/hub-contact.html";
};
</script>

</body>
</html>
