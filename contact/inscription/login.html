<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion TY‑LUDIC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="login.css">

</head>
<body>

<div class="container">

    <h1 data-i18n="login_title"></h1>
    <p class="subtitle" data-i18n="login_text"></p>

    <form id="login-form">

        <label data-i18n="login_pseudo"></label>
        <input type="text" id="pseudo" placeholder="Ton pseudo">

        <label data-i18n="login_passwd"></label>
        <input type="password" id="password" placeholder="Ton mot de passe">

        <p id="error-msg"></p>

        <button type="submit" class="btn" data-i18n="login_button"></button>

    </form>

    <p class="link">
        <a href="create-account.html" data-i18n="login_create"></a>
    </p>

</div>

<!-- Firebase MODULAR -->
<script type="module">
    import { auth } from "../../firebase/firebase-init.js";
    import { signInWithEmailAndPassword, updateProfile }
        from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

    function pseudoToEmail(pseudo) {
        return pseudo.toLowerCase() + "@tyludic.local";
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const pseudo = document.getElementById("pseudo").value.trim();
        const password = document.getElementById("password").value.trim();
        const errorBox = document.getElementById("error-msg");

        errorBox.textContent = "";

        if (pseudo.length < 3) {
            errorBox.textContent = "Pseudo invalide.";
            return;
        }

        try {
            const emailInterne = pseudoToEmail(pseudo);

            const userCred = await signInWithEmailAndPassword(
                auth,
                emailInterne,
                password
            );

            // 🔥 Mise à jour du profil Firebase Auth
            await updateProfile(userCred.user, {
                displayName: pseudo
            });

            // Stockage local (offline)
            localStorage.setItem("tyludic_uid", userCred.user.uid);
            localStorage.setItem("tyludic_pseudo", pseudo);

            // Redirection
            window.location.href = "login-ok.html";

        } catch (err) {
            errorBox.textContent = "Pseudo ou mot de passe incorrect.";
        }
    });
</script>

<!-- i18n -->
<script>
    const currentLang = localStorage.getItem("lang") || "fr";

    fetch("lang-login.json")
        .then(r => r.json())
        .then(data => {
            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                const text = data[currentLang][key];
                if (text) el.textContent = text;
            });
        })
        .catch(err => console.error("Erreur chargement lang-login.json", err));
</script>

</body>
</html>
